[package]
name = "captab-company"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy"] }

[dev-dependencies]
near-sdk = { version = "=5.17.2", features = ["unit-testing", "legacy"] }
near-workspaces = "=0.22.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"

